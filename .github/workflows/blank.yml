name: "每日自动抓取国会 CRS 报告"

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检查仓库代码
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装网络和解析依赖
        run: |
          pip install requests

      - name: 运行主抓取脚本
        run: python main.py

      - name: 强制同步推送到 GitHub Pages 公网
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add feed.xml rss.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "自动同步国会全真报告 [$(date)]" && git push)
