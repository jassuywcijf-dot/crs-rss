name: 每日自动抓取国会 CRS 报告

on:
  push:
    branches:
      - main
  schedule:
    # 🌟 开启全自动定时器：每天自动在后台帮你在固定时间运行抓取，再也不用手动点了
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检查仓库代码
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装网络和解析依赖
        run: |
          pip install requests

      - name: 运行主抓取脚本
        run: python main.py

      # 🌟 核心突破：强制将新生成的干净 feed.xml 提交并推送到你的 GitHub Pages 线上！
      - name: 强制同步推送到 GitHub Pages 公网
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add feed.xml
          # 如果文件有变化就提交，防止没有更新时报错卡死
          git diff --quiet && git diff --staged --quiet || (git commit -m "自动更新：同步最新美国国会 CRS 报告 [$(date)]" && git push)
